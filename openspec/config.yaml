# openspec/config.yaml — Sentinel SDD configuration
# Generated by sdd-init (hybrid persistence). Bootstrap state: the crate manifest does not exist yet;
# all test commands below are configured/planned but NOT executable until Cargo.toml lands.

schema: spec-driven

context: |
  Project: sentinel — cross-platform Rust CLI security scanner (secrets + vulnerable deps), pre-commit & CI.
  Stack: Rust stable, Edition 2024, single-crate binary CLI; modular synchronous pipeline; no Tokio; no DB;
  XDG filesystem cache for OSV advisory data; planned crates: Clap/clap_complete, Rayon, ureq, ignore.
  Status: bootstrap — no Cargo.toml/Cargo.lock/src yet; CI workflows and the pre-commit hook gate on the
  manifest (bootstrap hold) and activate automatically once it exists.
  Architecture: CLI → git-aware discovery → parallel detector engines (Rayon, CPU-bound) →
  normalize/fingerprint/dedupe → renderers (terminal, versioned JSON, SARIF 2.1.0); advisory-only LLM
  explain adapter (redacted, opt-in, off in CI/offline); deterministic, local-first, offline-capable.
  Constraints: no DB, no async runtime (ADR-0001); OSV + LLM external data treated as untrusted, validated
  at trust boundaries (ADR-0002, ADR-0003); secrets redacted at the engine boundary before any consumer.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference the PRD section and acceptance criteria being addressed
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Determinism requirements must assert byte-identical output expectations
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale and ADR references
    - Respect modular-monolith module boundaries (ADR-0001)
    - Keep the LLM explainer advisory-only; redaction happens at the engine boundary (ADR-0003)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns and the project rust-best-practices skill
      - Keep changes in reviewable units; CI enforces a 400-line PR budget (pr-check.yml)
    tdd: false
    test_command: "cargo test --all-features"
  verify:
    test_command: "cargo test --all-features"
    build_command: "cargo build --all-features"
    coverage_threshold: 0
    quality:
      - "cargo fmt --all -- --check"
      - "cargo clippy --all-targets --all-features -- -D warnings"
      - "cargo deny check"
      - "cargo audit"
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  strict_tdd_reason: "No runnable test runner — no Cargo.toml in bootstrap state; cargo test/clippy/fmt
    become executable only when the crate manifest lands. Test toolchain is configured (CI workflows,
    pre-commit hook, rust-toolchain.toml components, deny.toml) but not executable. Flip to true after
    crate bootstrap."
  test_runner:
    command: "cargo test --all-features"
    framework: Rust built-in test harness (libtest)
    executable: false
  layers:
    unit: "Rust #[cfg(test)] modules — planned, not executable"
    integration: "tests/ directory (Rust convention) — planned, not executable"
    e2e: "N/A for a CLI; pre-commit hook + CI workflows act as the integration gate — planned"
  coverage:
    command: "cargo llvm-cov --all-features --lcov --output-path lcov.info"
    executable: false
  quality:
    - tool: cargo fmt (formatter)
      command: "cargo fmt --all -- --check"
      executable: false
    - tool: cargo clippy (linter, deny warnings)
      command: "cargo clippy --all-targets --all-features -- -D warnings"
      executable: false
    - tool: cargo deny (licenses/bans/advisories)
      command: "cargo deny check"
      executable: false
    - tool: cargo audit (RUSTSEC advisories)
      command: "cargo audit"
      executable: false
    - tool: rustc (type checking via cargo check/build)
      command: "cargo check"
      executable: false
