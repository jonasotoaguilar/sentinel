version: 2
updates:
  # Dependencies are part of this product's security surface: the scanner's own
  # crates parse untrusted input, so an outdated one is a vulnerability in the
  # thing that reports vulnerabilities.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates arrive together, so the review cost is one pull
      # request a week rather than one per crate.
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The example pins a dependency with known advisories on purpose: it is the
  # fixture that makes the dependency engine's output real rather than
  # hypothetical. Bumping it would delete the thing the example demonstrates,
  # so updates to it are ignored here. The security *alerts* for it are left
  # alone: they are accurate, and dismissing a true signal is worse than
  # living with a known one.
  - package-ecosystem: pip
    directory: /examples/basic-scan
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: requests
