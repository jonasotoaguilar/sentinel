# Release: build per-target archives and publish one GitHub Release.
#
# Archive layout (named for the install docs): each archive holds a single
# runnable binary at its top level —
#   sentinel-<tag>-x86_64-unknown-linux-gnu.tar.gz  ->  sentinel
#   sentinel-<tag>-aarch64-apple-darwin.tar.gz       ->  sentinel
#   sentinel-<tag>-x86_64-pc-windows-msvc.zip        ->  sentinel.exe
# plus one shared checksum file: sentinel-<tag>-checksums.txt
# (sha256, verifiable with `sha256sum -c`)
# and one SBOM file: sentinel-<tag>-sbom.json
# (CycloneDX JSON, generated with `cargo cyclonedx`).
#
# Trust (why a stranger can believe the download): every file attached to
# the Release carries a keyless build-provenance attestation created with
# `actions/attest-build-provenance`, bound to this workflow's OIDC identity
# — there is no signing key to rotate and no third-party signing action.
# The archives additionally carry an SBOM attestation
# (`actions/attest-sbom`) over the shipped SBOM file, so the dependency
# list is as verifiable as the bytes. Verify with, e.g.:
#   gh attestation verify <file> --owner <org-or-user>
# Checksums stay for the download-and-compare path.
#
# Design (deliberate, see the feature doc): a hand-written matrix on native
# runners, so there is no cross-compilation and no release tooling beyond
# the official `actions/*` steps and the `cargo cyclonedx` subcommand
# (installed in the job, not a crate dependency). Each matrix job builds
# natively (`cargo build --release`, no `--target`) and labels its archive
# with the runner's native triple. A single `publish` job then resolves the
# tag once, generates the SBOM and checksums, attests every release file,
# and attaches them all to one Release for the tag.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the exercise Release (e.g. v0.1.0-test). Leave empty for workflow-test-<sha>."
        required: false
        default: ""
        type: string

# The publish job creates the Release with the workflow's GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native triples only: each runner builds for itself.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        # GitHub-hosted runners already ship rustup with stable; this is a
        # cheap no-op guard so the build never depends on the image default.
        run: rustup toolchain install stable --profile minimal

      - name: Build release binary
        run: cargo build --release --locked

      - name: Archive binary
        # bash runs everywhere (Git Bash on Windows), so one script covers
        # both formats; Windows uses bsdtar's `-a` (format by extension).
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="workflow-test-${GITHUB_SHA::8}"
          fi
          BIN="target/release/sentinel"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="${BIN}.exe"
            EXT="zip"
          else
            EXT="tar.gz"
          fi
          test -f "$BIN"
          mkdir -p dist staging
          cp "$BIN" staging/
          ARCHIVE="dist/sentinel-${TAG}-${{ matrix.target }}.${EXT}"
          if [ "$EXT" = "zip" ]; then
            tar -a -cf "$ARCHIVE" -C staging "$(basename "$BIN")"
          else
            tar -czf "$ARCHIVE" -C staging "$(basename "$BIN")"
          fi
          ls -la dist/

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-archive-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Attestations are keyless (OIDC): `id-token: write` mints the identity
    # and `attestations: write` stores the attestation. `contents: write`
    # (repeated here from the top level so this job's needs read as one
    # block) publishes the Release. The build jobs above do not attest, so
    # they keep the top-level `contents: write` only.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # `gh release create --target <sha>` resolves the commit through git, so this
      # job needs a checkout: its artifacts arrive by download, not by clone.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        # One source of truth for every step below: tag pushes use the tag,
        # exercise runs (workflow_dispatch) use the input or a sha-based name.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="workflow-test-${GITHUB_SHA::8}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release tag: $TAG"

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-archive-*
          merge-multiple: true
          path: dist

      - name: Install Rust toolchain
        # Same guard as the build jobs: the SBOM step needs cargo, and must
        # not depend on the runner image's default toolchain.
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-cyclonedx
        # Pinned (not latest) so the SBOM output cannot change under a
        # release without a reviewed workflow edit. 0.5.9 is the latest
        # release verified on crates.io when this was written. This installs
        # a build-time tool in the job; it is not a crate dependency, so
        # Cargo.toml and Cargo.lock are untouched.
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate SBOM
        env:
          # This step once failed with exit code 1 and printed no message at
          # all, which cost a dispatch to learn nothing. The environment now
          # asks for the detail up front: a failure that explains itself is
          # worth more than one that only reports that it happened.
          RUST_BACKTRACE: "1"
        # `cargo cyclonedx` writes bom.json next to Cargo.toml; rename it
        # into dist/ under the same tag scheme as the other release assets.
        # JSON (not XML) because actions/attest-sbom requires a
        # JSON-formatted SBOM file as its predicate.
        shell: bash
        run: |
          set -euo pipefail
          # No --all: this repository has one crate, so asking for "all
          # workspace members" buys nothing and takes a code path that failed
          # on a package-ID hash lookup in Cargo.lock. If this step fails
          # again, the next lines make the failure conclusive in one run
          # instead of costing another twenty minutes of guessing.
          cargo --version
          rustc --version
          grep -n 'name = "sentinel' Cargo.lock || true
          cargo cyclonedx -vv --format json
          # cargo-cyclonedx 0.5.9 names its output after the package
          # (sentinel-scan.cdx.json) rather than bom.json, so the file is
          # matched by extension. Asserting a name the tool never promised is
          # what failed three dispatches: the assertion, not the generator.
          mv *.cdx.json "dist/sentinel-${TAG}-sbom.json"
          test -f "dist/sentinel-${TAG}-sbom.json"
          ls -la dist/

      - name: Create checksums file
        # Unchanged format: bare filenames, verifiable with `sha256sum -c`
        # after downloading the assets into one directory. Split out of the
        # release step so the attestations below can cover this file too.
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          ARCHIVES=(sentinel-*.tar.gz sentinel-*.zip)
          if [ "${#ARCHIVES[@]}" -ne 3 ]; then
            echo "::error::expected 3 per-target archives, found ${#ARCHIVES[@]}: ${ARCHIVES[*]:-<none>}"
            exit 1
          fi
          sha256sum "${ARCHIVES[@]}" > "sentinel-${TAG}-checksums.txt"
          cat "sentinel-${TAG}-checksums.txt"

      - name: Attest build provenance
        # Keyless provenance for EVERY file attached to the Release
        # (archives, checksums, SBOM): the glob covers dist/sentinel-*
        # with no per-file bookkeeping to drift.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/sentinel-*'

      - name: Attest SBOM
        # Binds the shipped SBOM to the same release files it describes.
        uses: actions/attest-sbom@v4
        with:
          subject-path: 'dist/sentinel-*'
          sbom-path: 'dist/sentinel-${{ env.TAG }}-sbom.json'

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # TAG comes from the "Resolve release tag" step via $GITHUB_ENV.
          test -n "$TAG"
          cd dist
          shopt -s nullglob
          ARCHIVES=(sentinel-*.tar.gz sentinel-*.zip)
          if [ "${#ARCHIVES[@]}" -ne 3 ]; then
            echo "::error::expected 3 per-target archives, found ${#ARCHIVES[@]}: ${ARCHIVES[*]:-<none>}"
            exit 1
          fi
          CHECKSUMS="sentinel-${TAG}-checksums.txt"
          SBOM="sentinel-${TAG}-sbom.json"
          test -f "$CHECKSUMS"
          test -f "$SBOM"
          cat "$CHECKSUMS"
          # Exercise runs (workflow_dispatch without a v* tag) land as
          # prereleases so a test never becomes the "latest" release.
          PRE=""
          case "$TAG" in
            v*) ;;
            *) PRE="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            $PRE \
            "${ARCHIVES[@]}" "$CHECKSUMS" "$SBOM"

  docker:
    name: publish image
    # Additive by construction: runs only after the `publish` job created
    # the Release (three per-target archives, checksums, SBOM, build
    # provenance and SBOM attestations, one Release), so an image failure
    # can never take the release assets down with it. Exercise runs
    # (workflow_dispatch) reach this job too, which usefully proves the
    # Dockerfile on every test release; only real `v*` tags additionally
    # move `:latest`.
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Narrowest set that works: `contents: read` checks the build context
    # out, `packages: write` pushes to GHCR. Scoped to this job on purpose:
    # every other job keeps exactly the permissions it already had.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        # Docker's own actions (with docker/build-push-action below): both
        # are maintained by Docker and are the standard way to publish
        # images from Actions — no third-party publisher in the loop, and
        # no hand-rolled `docker login` that could leak the token into a
        # process list or a log. Justification for the exception to the
        # actions/*-only rule: pushing to a registry is not something the
        # official actions cover, and reimplementing auth and BuildKit
        # plumbing in shell would be more code to review for less safety.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        # Same single-source-of-truth rule as the publish job: tag pushes
        # use the tag, exercise runs use the input or a sha-based name.
        # Full releases (`v*`, the only ones the publish job leaves as
        # non-prereleases) additionally move `:latest`; prereleases and
        # exercise builds publish only their own tag. The owner is
        # lowercased because GHCR rejects uppercase namespace segments.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="workflow-test-${GITHUB_SHA::8}"
          fi
          OWNER="$(tr 'A-Z' 'a-z' <<<"${{ github.repository_owner }}")"
          TAGS="ghcr.io/${OWNER}/sentinel:${TAG}"
          case "$TAG" in
            v*) TAGS="${TAGS}$(printf '\nghcr.io/%s/sentinel:latest' "$OWNER")" ;;
          esac
          {
            echo "IMAGE_TAGS<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_ENV"
          printf 'Image tags:\n%s\n' "$TAGS"

      - name: Build and push image
        # Allowed to fail on purpose: the Release this image belongs to is
        # already published by the `publish` job, and a registry outage, a
        # transient network failure, or a GHCR permission change is outside
        # this workflow's control — none of those may retroactively fail a
        # release whose verifiable artifacts are already out. The failure
        # mode within our control (a broken Dockerfile) is caught before
        # merge with a local `docker build` (see the Dockerfile header),
        # never by the release run.
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAGS }}
