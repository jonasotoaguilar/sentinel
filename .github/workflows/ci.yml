name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, Lint & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Sentinel is being bootstrapped: the crate manifest does not exist yet.
      # Until Cargo.toml lands, CI deliberately runs nothing and reports this
      # hold with a clear error. Once the crate is bootstrapped, this workflow
      # activates automatically — no changes to this file are needed.
      - name: Bootstrap gate (require Cargo.toml)
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::error::Cargo.toml not found — this repository is in bootstrap state, so no tests or coverage were run. Add the crate manifest (crate bootstrap) and CI activates automatically; no workflow changes needed."
            exit 1
          fi

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint (clippy, deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Install coverage tool (cargo-llvm-cov)
        run: cargo install cargo-llvm-cov --locked

      - name: Collect coverage (lcov)
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage report
        if: always() && hashFiles('lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test
          path: lcov.info

  dependency-security:
    name: Dependency Security (cargo deny + cargo audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap gate (require Cargo.toml)
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::error::Cargo.toml not found — dependency checks (cargo deny / cargo audit) are on bootstrap hold until the crate manifest exists."
            exit 1
          fi

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny (licenses, bans, advisories)
        run: cargo deny check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (RUSTSEC advisories)
        run: cargo audit

  code-scan:
    name: Code Scanning (Clippy SARIF)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap gate (require Cargo.toml)
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::error::Cargo.toml not found — code scanning (clippy SARIF) is on bootstrap hold until the crate manifest exists."
            exit 1
          fi

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install clippy-sarif
        run: cargo install clippy-sarif --locked

      - name: Run clippy and emit SARIF
        run: |
          cargo clippy --all-targets --all-features --message-format=json \
            | clippy-sarif --output clippy.sarif

      - name: Upload SARIF to code scanning
        if: hashFiles('clippy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: clippy.sarif
