[package]
name = "sentinel-scan"
version = "0.2.0"
edition = "2024"
license = "MIT"
# The crate name `sentinel` is taken on crates.io by an unrelated project,
# so the package publishes as `sentinel-scan`. The library and binary keep
# the name `sentinel`, so `use sentinel::...`, `cargo_bin("sentinel")`,
# and every documented command are unchanged; only `cargo install` takes
# the `sentinel-scan` name.
description = "Scan Git repositories for secrets, vulnerable dependencies, and risky code patterns before commit or in CI"
repository = "https://github.com/jonasotoaguilar/sentinel"
keywords = ["security", "secrets", "scanner", "audit", "cli"]
categories = ["command-line-utilities"]
# Measured floor (see task log): edition 2024 needs 1.85, `if`-let chains
# need 1.88, `usize::is_multiple_of` needs 1.87, and `str::floor_char_boundary`
# (used in src/engine/dependency/map.rs and src/osv/validate.rs) needs 1.91
# — clippy's `incompatible_msrv` lint confirmed 1.88 was too low. Verified by
# building with a minimal 1.91 toolchain.
rust-version = "1.91"

[lib]
name = "sentinel"

[[bin]]
name = "sentinel"
path = "src/main.rs"

[profile.release]
# Smaller release archives with no runtime cost.
strip = true

[dependencies]
blake3 = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ignore = "0.4"
directories = "6"
percent-encoding = "2"
ureq = "3"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"

[dev-dependencies]
assert_cmd = "2"
clap_mangen = "0.3"
insta = "1"
jsonschema = { version = "0.58.6", default-features = false }
predicates = "3"
tempfile = "3"
