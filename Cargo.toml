[package]
name = "sentinel"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
percent-encoding = "2"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

[dev-dependencies]
assert_cmd = "2"
insta = "1"
jsonschema = { version = "0.49.9", default-features = false }
predicates = "3"
tempfile = "3"
