[package]
name = "sentinel"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
blake3 = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ignore = "0.4"
directories = "6"
percent-encoding = "2"
ureq = "3"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
jsonschema = { version = "0.49.9", default-features = false }
predicates = "3"
tempfile = "3"
